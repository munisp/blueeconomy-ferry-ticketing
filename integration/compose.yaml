# Local integration dependencies for blueeconomy-ferry-ticketing.
# Images are digest-pinned; CI (.github/workflows/integration.yml) uses a
# pinned `services:` PostgreSQL and starts the kafka service from this file.
# This topology is local-only and is not production evidence.
services:
  postgres:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    network_mode: host
    command: ["postgres", "-p", "55437"]
    environment:
      POSTGRES_DB: blueeconomy_ferries
      POSTGRES_USER: blueeconomy
      POSTGRES_PASSWORD: local-only-integration-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 55437 -U blueeconomy -d blueeconomy_ferries"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  # Single-broker KRaft Kafka for the outbox drain integration test.
  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    network_mode: host
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s
    tmpfs:
      - /var/lib/kafka/data
